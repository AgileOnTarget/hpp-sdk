openapi: 3.1.0
info:
  title: Human Presence Protocol Verifier API (Shipping)
  version: "0.4.0"
  summary: The HTTP surface implemented by the production HPP verifier.
  description: |
    This document describes the API actually exposed by the shipping HPP verifier
    at `https://hpp-verifier.onrender.com`. It is the contract that the iOS Swift
    Package (`ios/`) and the Website JS SDK (`website/`) in this repository
    integrate against.

    A separate file, `openapi-canonical-v1-future.yaml`, describes a future-state
    `/v1/*` API surface that the project intends to converge on. Until that
    convergence ships, integrators should target the surface described here.

    ## Core flow

    1. Client `POST /challenge` → server returns `{ nonce, epoch, site, challenge_id }`.
    2. Client signs an HPP-Proof JWT (ES256, 64-byte raw IEEE P1363 signature)
       and `POST /verify` with `Authorization: Bearer <jwt>` → server returns
       `{ session_token, receipt_id, assurance }`.
    3. Optionally, the client `POST /relay/:id` to deposit the session token
       into a browser-side relay slot for QR-based unlock flows.

    For the canonical signing and JWT details, see
    `protocol/docs/canonical-signing.md` and `protocol/docs/core-spec.md`.

  contact:
    name: Agile On Target LLC
    url: https://github.com/AgileOnTarget/hpp-sdk
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  x-uspto-customer-number: "224891"
  x-status: Shipping reference (matches production verifier)

servers:
  - url: https://hpp-verifier.onrender.com
    description: Reference production verifier (Render)
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: attestation
    description: Core HPP attestation flow (challenge → sign → verify).
  - name: receipts
    description: Verifier-issued receipts and the public hash-chained receipt log.
  - name: session
    description: Session-token lifecycle (extend, disconnect, poll).
  - name: relay
    description: Relay slots that bridge phone attestation to browser unlock.
  - name: utility
    description: QR generation and health checks.

paths:
  /challenge:
    post:
      tags: [attestation]
      summary: Issue a fresh challenge
      description: |
        Issues a server-authoritative `{ nonce, epoch, site, challenge_id }` tuple.
        The challenge is registered server-side with a 300-second TTL and is
        single-use: it is consumed atomically when the client successfully calls
        `POST /verify`.

        Rate-limited per source IP (default 60 / 60 s).
      operationId: issueChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hpp_ver]
              properties:
                hpp_ver:
                  type: string
                  description: HPP protocol version. Send `"1.0"`.
                  example: "1.0"
                age_predicate:
                  type: object
                  description: Optional age-gate predicate.
                  required: [min_age]
                  properties:
                    min_age:
                      type: integer
                      minimum: 1
                      example: 18
      responses:
        "200":
          description: Challenge issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          description: Missing or malformed `hpp_ver`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructuredFailure"
              example:
                status: failure
                reason: MISSING_FIELD
                field: hpp_ver
        "429":
          $ref: "#/components/responses/RateLimited"

  /verify:
    post:
      tags: [attestation]
      summary: Submit a signed HPP proof and obtain a session token
      description: |
        Executes the verifier's 11-step decision flow against a signed HPP proof.
        Two transport variants are accepted:

        **JWT path (preferred — used by both ios/ and website/ SDKs):**
        Send the proof as `Authorization: Bearer <jwt>` with an empty JSON body.
        The JWT is an ES256 token with `typ: HPP-Proof`, header
        `{"alg":"ES256","kid":"<8-char compact pubkey fingerprint>","typ":"HPP-Proof"}`
        and a sorted-keys payload containing `assurance, challenge_id, epoch, exp,
        hpp_ver, iat, nonce, pub_key, site` (plus optional `age_min, age_qualified`).
        The signature is the raw IEEE P1363 64-byte R‖S form (RFC 7518 §3.4).

        **Legacy `{ payload, signature }` path:**
        Send the canonical JSON payload and a base64url DER-encoded ECDSA P-256
        signature in the request body.

        On success, the client receives a session token (HMAC-SHA256, 600 s TTL by
        default) and a chain-linked receipt UUID.

        Rate-limited per public key (default 30 / 60 s).
      operationId: verifyProof
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
            example: Bearer eyJhbGciOiJFUzI1NiIsImtpZCI6IjgwMzdjYmUwIiwidHlwIjoiSFBQLVByb29mIn0...
          description: |
            `Bearer <ES256 HPP-Proof JWT>`. Required for the JWT path.
            Mutually exclusive with the `{ payload, signature }` body path.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: JWT path — empty body.
                  additionalProperties: false
                - $ref: "#/components/schemas/LegacyVerifyBody"
      responses:
        "200":
          description: Verification succeeded.
          content:
            application/json:
              schema:
                type: object
                required: [status, session_token, receipt_id, assurance]
                properties:
                  status:
                    type: string
                    enum: [success]
                  session_token:
                    type: string
                    description: HMAC-signed token. Format `<base64url(payload)>.<base64url(HMAC-SHA256)>`.
                  receipt_id:
                    type: string
                    format: uuid
                  assurance:
                    $ref: "#/components/schemas/Assurance"
        "400":
          description: Malformed JWT, malformed payload, missing required fields, challenge not found, challenge expired, missing age claim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructuredFailure"
        "401":
          description: Cryptographic or policy failure (invalid signature, replay, site mismatch, epoch expired, assurance insufficient).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructuredFailure"
              examples:
                INVALID_SIG:
                  value:
                    status: failure
                    reason: INVALID_SIG
                    primitive: P2
                    invariant_ref: INV-02
                REPLAY_DETECTED:
                  value:
                    status: failure
                    reason: REPLAY_DETECTED
                    primitive: P13
                    invariant_ref: INV-13
                SITE_MISMATCH:
                  value:
                    status: failure
                    reason: SITE_MISMATCH
                    primitive: P15
                    invariant_ref: INV-15
                EPOCH_EXPIRED:
                  value:
                    status: failure
                    reason: EPOCH_EXPIRED
                    primitive: P1
                    invariant_ref: INV-01
                ASSURANCE_INSUFFICIENT:
                  value:
                    status: failure
                    reason: ASSURANCE_INSUFFICIENT
                    primitive: P2
                    invariant_ref: INV-02
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: Internal verifier error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructuredFailure"
              example:
                status: failure
                reason: INTERNAL_ERROR
        "502":
          description: Verifier cold-start. Retry after a few seconds.
        "503":
          description: Verifier cold-start. Retry after a few seconds.

  /receipt/{receipt_id}:
    get:
      tags: [receipts]
      summary: Retrieve a single chain-linked receipt
      description: |
        Returns the full chain-linked receipt for a given UUID.
        Authentication: a valid session token (header, cookie, or query param).
      operationId: getReceipt
      parameters:
        - in: path
          name: receipt_id
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/SessionTokenQuery"
        - $ref: "#/components/parameters/SessionTokenAuthHeader"
      responses:
        "200":
          description: Receipt found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "401":
          $ref: "#/components/responses/SessionInvalid"
        "404":
          description: Receipt not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: RECEIPT_NOT_FOUND }

  /receipts/{pubkey}:
    get:
      tags: [receipts]
      summary: List all receipts for a public key (Session History — SH.1)
      description: |
        Returns every receipt that the verifier has ever issued for the given
        public key. Authentication: a session token whose underlying receipt
        belongs to the same public key (the SH.1 owner-only invariant).

        Heavy fields (full pub_key, signature, JWT, SPKI) are stripped from the
        per-receipt projection; only canonical-fields needed for chain
        verification plus the optional age fields are returned.
      operationId: listReceiptsForPubKey
      parameters:
        - in: path
          name: pubkey
          required: true
          schema: { type: string }
          description: Base64url X9.63 uncompressed public key (65 bytes, leading `0x04`).
        - $ref: "#/components/parameters/SessionTokenQuery"
        - $ref: "#/components/parameters/SessionTokenAuthHeader"
      responses:
        "200":
          description: Receipts list.
          content:
            application/json:
              schema:
                type: object
                required: [pub_key, count, receipts]
                properties:
                  pub_key: { type: string }
                  count:   { type: integer }
                  receipts:
                    type: array
                    items: { $ref: "#/components/schemas/ReceiptSummary" }
        "401":
          $ref: "#/components/responses/SessionInvalid"
        "403":
          description: Session's pub_key does not match requested pubkey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructuredFailure"
              example:
                status: failure
                reason: PUBKEY_MISMATCH
        "429":
          $ref: "#/components/responses/RateLimited"

  /session:
    get:
      tags: [session]
      summary: Decode session metadata
      description: Returns lightweight session info — receipt_id, expires_at, assurance, optional age fields.
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/SessionTokenQuery"
        - $ref: "#/components/parameters/SessionTokenAuthHeader"
      responses:
        "200":
          description: Session metadata.
          content:
            application/json:
              schema:
                type: object
                required: [receipt_id, expires_at, assurance]
                properties:
                  receipt_id:        { type: string, format: uuid }
                  expires_at:        { type: integer, description: Unix seconds. }
                  assurance:         { $ref: "#/components/schemas/Assurance" }
                  age_qualified:     { type: boolean }
                  age_predicate_min: { type: integer }
        "401":
          $ref: "#/components/responses/SessionInvalid"

  /session/extend:
    post:
      tags: [session]
      summary: Extend a session by issuing a fresh token
      description: |
        Issues a fresh session token with a renewed 600 s TTL, reusing the
        underlying receipt and assurance. The old token is blacklisted.

        Called by the iOS app after a local biometric re-authentication.
      operationId: extendSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_token]
              properties:
                session_token: { type: string }
      responses:
        "200":
          description: Session extended.
          content:
            application/json:
              schema:
                type: object
                required: [session_token, expires_at]
                properties:
                  session_token: { type: string }
                  expires_at:    { type: integer }
        "400":
          description: Missing token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: MISSING_TOKEN }
        "401":
          description: Invalid token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: INVALID_TOKEN }

  /session/poll:
    get:
      tags: [session]
      summary: Poll for an extended session
      description: |
        Browser polls this every 10 s. If the iOS app extended the session
        recently (within the last 120 s), returns the new token; otherwise
        returns `{ extended: false }`.
      operationId: pollSession
      parameters:
        - in: query
          name: session_token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Poll result.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [extended]
                    properties:
                      extended: { type: boolean, enum: [false] }
                  - type: object
                    required: [extended, session_token, expires_at]
                    properties:
                      extended:      { type: boolean, enum: [true] }
                      session_token: { type: string }
                      expires_at:    { type: integer }

  /session/disconnect:
    post:
      tags: [session]
      summary: Revoke a session token
      description: |
        Best-effort. The token is blacklisted for 600 s if valid; invalid tokens
        are silently ignored. Designed to be invoked via `navigator.sendBeacon`
        from a browser `beforeunload` handler.
      operationId: disconnectSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_token]
              properties:
                session_token: { type: string }
      responses:
        "200":
          description: Disconnected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: disconnected }
        "400":
          description: Missing token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: SESSION_TOKEN_MISSING }

  /relay/create:
    post:
      tags: [relay]
      summary: Create a new relay slot
      description: |
        Creates an empty relay slot with a 600 s TTL. The browser polls the
        slot's `GET /relay/{relay_id}` endpoint until an iOS device deposits a
        session token via `POST /relay/{relay_id}`.
      operationId: createRelay
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: Relay slot created.
          content:
            application/json:
              schema:
                type: object
                required: [relay_id]
                properties:
                  relay_id:
                    type: string
                    description: 32-char hex.
                    pattern: "^[0-9a-f]{32}$"

  /relay/{relay_id}:
    parameters:
      - in: path
        name: relay_id
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{32}$" }
    get:
      tags: [relay]
      summary: Poll a relay slot
      description: Browsers poll this endpoint every 2 seconds. Always returns 200 with a `status` discriminator.
      operationId: pollRelay
      responses:
        "200":
          description: Relay state.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [waiting, expired, not_found] }
                  - type: object
                    required: [status, session_token]
                    properties:
                      status:        { type: string, enum: [ready] }
                      session_token: { type: string }
    post:
      tags: [relay]
      summary: Deposit a session token into a relay slot
      description: |
        Called by the iOS app after a successful `POST /verify`. The session
        token is verified server-side before it is stored, so a malicious QR
        cannot inject an arbitrary token.
      operationId: fulfillRelay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_token]
              properties:
                session_token: { type: string }
      responses:
        "200":
          description: Relay fulfilled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
        "400":
          description: Token missing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: SESSION_TOKEN_MISSING }
        "401":
          description: Token failed verification.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: SESSION_INVALID }
        "404":
          description: Relay slot not found or expired.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: RELAY_NOT_FOUND_OR_EXPIRED }
    delete:
      tags: [relay]
      summary: Disconnect a relay (and optionally blacklist a session token)
      operationId: disconnectRelay
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                session_token: { type: string, description: If provided, blacklisted for 600 s. }
      responses:
        "200":
          description: Disconnected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: disconnected }

  /chain/public:
    get:
      tags: [receipts]
      summary: Public projection of the global receipt chain
      description: |
        Returns a public, sanitized projection of the global receipt chain
        — only the fields needed to verify hash-chain integrity. No public
        keys, no nonces, no signatures.
      operationId: getPublicChain
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Chain page.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [total, count, offset, chain]
                properties:
                  total:  { type: integer }
                  count:  { type: integer }
                  offset: { type: integer }
                  chain:
                    type: array
                    items:
                      type: object
                      required: [index, receipt_hash, prev_receipt_hash, server_epoch]
                      properties:
                        index:             { type: integer }
                        receipt_hash:      { type: string, description: SHA-256 hex. }
                        prev_receipt_hash: { type: string, description: SHA-256 hex, or `GENESIS`. }
                        server_epoch:      { type: integer }
        "429":
          $ref: "#/components/responses/RateLimited"

  /qr:
    get:
      tags: [utility]
      summary: Render a PNG QR code encoding an HPP endpoint registration payload
      description: |
        Returns a 400×400 PNG QR code at error-correction level H. The encoded
        payload is JSON: `{ verifier_url, site, hpp_ver, session_duration,
        relay_id?, age_predicate? }`.
      operationId: getQR
      parameters:
        - in: query
          name: relay_id
          schema: { type: string }
          description: If provided, baked into the QR for the locked-page unlock flow.
        - in: query
          name: verifier_url
          schema: { type: string, format: uri }
          description: Override target verifier URL. Must be http or https.
        - in: query
          name: site
          schema: { type: string }
          description: Override site identifier. Defaults to the hostname of `verifier_url`.
        - in: query
          name: session_duration
          schema: { type: integer, default: 600 }
        - in: query
          name: age_predicate_min_age
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: PNG.
          content:
            image/png:
              schema: { type: string, format: binary }
        "400":
          description: Invalid `verifier_url`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:   { type: string, example: INVALID_VERIFIER_URL }
                  message: { type: string }

  /health:
    get:
      tags: [utility]
      summary: Liveness probe
      description: Returns 200 when the verifier is up. Used by deployment platforms and integration tests.
      operationId: health
      responses:
        "200":
          description: Verifier is up.
          content:
            application/json:
              schema:
                type: object

components:
  parameters:
    SessionTokenQuery:
      in: query
      name: session_token
      schema: { type: string }
      description: "Session token (alternative to `Authorization: Bearer` and cookie)."
    SessionTokenAuthHeader:
      in: header
      name: Authorization
      schema: { type: string, example: "Bearer <session_token>" }
      description: |
        Either a session token as `Bearer <token>` or, on `/verify` only, an
        ES256 HPP-Proof JWT.

  responses:
    RateLimited:
      description: |
        NPHT rate-limit exceeded. The response carries a `Retry-After` header
        (seconds) and a structured body identifying the bound that triggered.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StructuredFailure"
          example:
            status: failure
            reason: NPHT_RATE_EXCEEDED
            primitive: NPHT
            invariant_ref: INV-NPHT-RATE
            bound:
              scope: per_ip
              max: 60
              window_ms: 60000
            retry_after_ms: 8421

    SessionInvalid:
      description: Session-token problem.
      content:
        application/json:
          schema:
            type: object
            required: [valid, reason]
            properties:
              valid:  { type: boolean, enum: [false] }
              reason:
                type: string
                enum:
                  - SESSION_ABSENT
                  - SESSION_INVALID
                  - SESSION_EXPIRED
                  - SESSION_DISCONNECTED
                  - SESSION_RECEIPT_NOT_FOUND

  schemas:
    Assurance:
      type: string
      description: Authentication factor that produced the proof.
      enum: [BIOMETRIC_FACE, BIOMETRIC_TOUCH, PASSCODE]

    ChallengeResponse:
      type: object
      required: [nonce, epoch, site, challenge_id]
      properties:
        nonce:
          type: string
          description: 64 hex chars (256-bit random).
          pattern: "^[0-9a-f]{64}$"
        epoch:
          type: integer
          description: Server-authoritative Unix seconds.
        site:
          type: string
          description: Site identifier the verifier issued (matches the verifier's `SITE` env var).
        challenge_id:
          type: string
          format: uuid
        age_predicate:
          type: object
          description: Echoed back when the request included an age predicate.
          properties:
            min_age: { type: integer }

    LegacyVerifyBody:
      type: object
      required: [payload, signature]
      properties:
        payload:
          type: object
          required: [challenge_id, nonce, epoch, pub_key, assurance, hpp_ver, site]
          properties:
            challenge_id:  { type: string, format: uuid }
            nonce:         { type: string, pattern: "^[0-9a-f]{64}$" }
            epoch:         { type: integer }
            pub_key:
              type: string
              description: Base64url X9.63 EC point (uncompressed or compressed).
            assurance:     { $ref: "#/components/schemas/Assurance" }
            hpp_ver:       { type: string }
            site:          { type: string }
            age_qualified: { type: boolean, description: Required if the challenge had an age predicate. }
        signature:
          type: string
          description: Base64url DER-encoded ECDSA P-256 signature over the canonical payload bytes.

    StructuredFailure:
      type: object
      required: [status, reason]
      properties:
        status:        { type: string, enum: [failure] }
        reason:        { type: string }
        field:         { type: string }
        fields:
          type: array
          items: { type: string }
        primitive:
          type: string
          description: "HPP primitive identifier (e.g. `P2`, `NPHT`)."
        invariant_ref:
          type: string
          description: "HPP invariant identifier (e.g. `INV-02`, `INV-13`)."
        bound:
          type: object
          description: "For `NPHT_RATE_EXCEEDED`, the bound that triggered."
          properties:
            scope:     { type: string, enum: [per_ip, per_pubkey, per_relying_party] }
            max:       { type: integer }
            window_ms: { type: integer }
        retry_after_ms: { type: integer }

    Receipt:
      type: object
      required:
        - receipt_id
        - challenge_id
        - nonce
        - epoch
        - assurance
        - pub_key_fingerprint
        - server_epoch
        - prev_receipt_hash
        - receipt_hash
        - pub_key
        - hpp_ver
        - site
      properties:
        receipt_id:          { type: string, format: uuid }
        challenge_id:        { type: string, format: uuid }
        nonce:               { type: string, pattern: "^[0-9a-f]{64}$" }
        epoch:               { type: integer }
        assurance:           { $ref: "#/components/schemas/Assurance" }
        pub_key_fingerprint: { type: string, description: Last 8 hex chars of SHA-256(pub_key). }
        server_epoch:        { type: integer }
        prev_receipt_hash:   { type: string, description: SHA-256 hex, or `GENESIS`. }
        receipt_hash:        { type: string, description: SHA-256 hex over canonical fields. }
        pub_key:             { type: string }
        pub_key_spki:        { type: string, description: Base64 SPKI DER (for WebCrypto importKey). }
        signature:
          type: string
          nullable: true
          description: Base64url DER ECDSA (legacy path) — null on JWT path.
        jwt:
          type: string
          nullable: true
          description: Full ES256 HPP-Proof JWT (JWT path) — null on legacy path.
        hpp_ver:             { type: string }
        site:                { type: string }
        age_predicate_min:   { type: integer }
        age_qualified:       { type: boolean }

    ReceiptSummary:
      type: object
      description: Sanitized projection used by `/receipts/{pubkey}`.
      required:
        - receipt_id
        - challenge_id
        - nonce
        - epoch
        - assurance
        - pub_key_fingerprint
        - server_epoch
        - prev_receipt_hash
        - receipt_hash
        - site
      properties:
        receipt_id:          { type: string, format: uuid }
        challenge_id:        { type: string, format: uuid }
        nonce:               { type: string }
        epoch:               { type: integer }
        assurance:           { $ref: "#/components/schemas/Assurance" }
        pub_key_fingerprint: { type: string }
        server_epoch:        { type: integer }
        prev_receipt_hash:   { type: string }
        receipt_hash:        { type: string }
        site:                { type: string }
        age_predicate_min:   { type: integer }
        age_qualified:       { type: boolean }
