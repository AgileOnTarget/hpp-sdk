<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HPP — Basic Drop-in Example</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f0; color: #1a1a1a;
      margin: 0; padding: 3rem 1.5rem;
      min-height: 100vh; box-sizing: border-box;
    }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.6rem; font-weight: 500; margin: 0 0 .5rem; color: #1a3a6b; }
    p  { color: #555; line-height: 1.6; margin: 0 0 2rem; }
    #hpp-gate { margin-top: 2rem; }
    #unlocked { display: none; padding: 1.5rem; background: #e8f5e8; border: 1px solid #4a7a4a;
                border-radius: 6px; margin-top: 2rem; }
    code { background: #eee; padding: .15em .35em; border-radius: 3px; font-size: .9em; }
  </style>
</head>
<body>
  <main>
    <h1>Protected content</h1>
    <p>This page renders an HPP gate using <code>HPP.gate(...)</code>. Scan the QR with the HPP iPhone app to unlock.</p>

    <div id="hpp-gate"></div>

    <div id="unlocked">
      <strong>Unlocked.</strong>
      <p style="margin-top:.5rem">Session token received and forwarded to your relying-party backend.</p>
    </div>
  </main>

  <script src="../dist/hpp.js"></script>
  <script>
    HPP.gate({
      container: '#hpp-gate',
      verifier:  'https://hpp-verifier.onrender.com',
      site:      'example.com',
      onUnlock: function (session) {
        // session.sessionToken — POST this to your backend over TLS.
        document.getElementById('hpp-gate').style.display    = 'none';
        document.getElementById('unlocked').style.display    = 'block';
        console.log('[HPP] unlocked', session);
      },
      onExpired: function () {
        console.log('[HPP] QR expired');
      },
      onError: function (err) {
        console.error('[HPP] error', err);
      },
    });
  </script>
</body>
</html>
